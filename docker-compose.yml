# Local infrastructure for Tarweej Phase 1
# Ports:
#   PostgreSQL  5432
#   Redis       6379
#   MinIO API   9000
#   MinIO UI    9001
#
# Note: Official `minio/minio` was not pullable in some CI/agent networks.
# We use `bitnamilegacy/minio` (S3-compatible MinIO distribution) for local object storage.

services:
  postgres:
    image: postgres:17-alpine
    container_name: tarweej-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tarweej
      POSTGRES_PASSWORD: tarweej_dev_password
      POSTGRES_DB: tarweej
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tarweej -d tarweej']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: tarweej-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: bitnamilegacy/minio:latest
    container_name: tarweej-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: tarweej_minio
      MINIO_ROOT_PASSWORD: tarweej_minio_dev_password
      MINIO_DEFAULT_BUCKETS: tarweej-dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  postgres_data:
  redis_data:
  minio_data:
