services:
  postgres:
    image: postgres:17-alpine
    container_name: tarweej-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tarweej
      POSTGRES_PASSWORD: tarweej_dev_password
      POSTGRES_DB: tarweej
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tarweej -d tarweej']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: tarweej-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
