include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  # Flutter 3.47+ deprecates package:flutter/material.dart in favor of
  # material_ui / cupertino_ui. Keep classic Material imports for the Phase 1
  # shell; migrate when go_router / riverpod ecosystem catches up.
  errors:
    deprecated_member_use: ignore

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
