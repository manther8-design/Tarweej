# Optional local Prometheus against a running Tarweej API (host network / host.docker.internal).
# Does not start the API itself — use root docker-compose + pnpm for app deps.

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: tarweej-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

volumes:
  prometheus_data:
