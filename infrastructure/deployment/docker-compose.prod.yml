# Prod-oriented single-region Compose for Tarweej modular monolith.
# Secrets come from --env-file / environment — no demo credentials hardcoded.
#
# Usage:
#   docker compose -f infrastructure/deployment/docker-compose.prod.yml --env-file .env.production up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    volumes:
      - tarweej_pg_data:/var/lib/postgresql/data
    networks:
      - tarweej_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    # Do not publish 5432 publicly in production; keep private network only.

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - tarweej_redis_data:/data
    networks:
      - tarweej_internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    image: tarweej-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER required}
      OBJECT_STORAGE_DRIVER: ${OBJECT_STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-30}
      OTP_RATE_LIMIT_WINDOW_SECONDS: ${OTP_RATE_LIMIT_WINDOW_SECONDS:-60}
      OTP_RATE_LIMIT_MAX: ${OTP_RATE_LIMIT_MAX:-3}
    ports:
      - '${API_PUBLISH_PORT:-3000}:3000'
    networks:
      - tarweej_internal
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

networks:
  tarweej_internal:
    driver: bridge

volumes:
  tarweej_pg_data:
  tarweej_redis_data:
